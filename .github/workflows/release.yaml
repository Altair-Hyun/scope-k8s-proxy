name: Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...

  build:
    name: Build
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            RUNNER_OS: linux
          - os: macos-latest
            RUNNER_OS: darwin
          - os: windows-latest
            RUNNER_OS: windows
        goarch: [amd64, arm64]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make build
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            scope-k8s-proxy-${{ matrix.RUNNER_OS }}-${{ matrix.goarch }}
            scope-k8s-proxy-${{ matrix.RUNNER_OS }}-${{ matrix.goarch }}.sha256
